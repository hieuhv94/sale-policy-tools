# Xác thực kết nối. Chép từ mặc định của ảnh postgres:16-alpine, thêm một dòng
# cho kết nối NHÂN BẢN — pg_basebackup dùng kênh đó, và ảnh gốc chỉ mở nhân bản
# qua socket cục bộ nên job sao lưu chạy ở container khác sẽ bị từ chối.
#
# TYPE  DATABASE        USER      ADDRESS        METHOD
local   all             all                      trust
host    all             all       127.0.0.1/32   trust
host    all             all       ::1/128        trust
local   replication     all                      trust
host    replication     all       127.0.0.1/32   trust
host    replication     all       ::1/128        trust

# Mạng nội bộ Docker: vẫn phải có mật khẩu. Cùng mạng không phải căn cứ để tin.
host    replication     all       all            scram-sha-256
host    all             all       all            scram-sha-256
