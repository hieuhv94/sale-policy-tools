# Cấu hình Postgres cho VM 4 vCPU / 8 GB (mục 11 bản thiết kế).
# Ảnh gốc chạy mặc định 128MB bộ đệm — hợp với máy 1GB, không hợp với máy này.

# --- Kết nối -----------------------------------------------------------------
# BẮT BUỘC. Thay nguyên file cấu hình là mất luôn dòng này của ảnh gốc, và
# Postgres quay về mặc định `localhost` — container khoẻ mạnh, healthcheck xanh
# (pg_isready chạy qua socket Unix), nhưng không service nào kết nối được.
listen_addresses = '*'

# 10 service × 8 kết nối = 80, cộng migrate, job backup, psql thủ công, và pool
# cũ còn treo vài giây mỗi lần restart. Mặc định 100 là quá sát; hỏng ở đây báo
# "too many clients" và service không khởi động được.
max_connections = 200

# --- Bộ nhớ ------------------------------------------------------------------
shared_buffers = 2GB                  # ~25% RAM
effective_cache_size = 5GB            # gợi ý cho bộ lập kế hoạch, không cấp phát thật
work_mem = 16MB                       # mỗi node sắp xếp/băm, không phải mỗi truy vấn
maintenance_work_mem = 512MB          # VACUUM, CREATE INDEX

# --- WAL và điểm kiểm tra ----------------------------------------------------
wal_level = replica                   # đủ cho archive và PITR
archive_mode = on
archive_command = 'test ! -f /archive/%f && cp %p /archive/%f'
archive_timeout = 300                 # ép cắt WAL mỗi 5 phút, chặn trần mất dữ liệu
max_wal_size = 2GB
min_wal_size = 256MB
checkpoint_completion_target = 0.9

# --- Truy vết truy vấn chậm --------------------------------------------------
# Không bật thì "hệ thống chậm dần" không có bằng chứng nào để lần.
log_min_duration_statement = 500      # ms
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0                    # mọi file tạm đều là dấu hiệu work_mem thiếu

# --- Tự động dọn -------------------------------------------------------------
# Bảng outbox và refresh_token bị xoá liên tục nên sinh nhiều bản chết.
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
