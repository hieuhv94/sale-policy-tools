name: csbh

# Log Docker mặc định KHÔNG giới hạn dung lượng. Mười service cộng Postgres ghi
# cả truy vấn chậm sẽ làm đầy ổ sau vài tháng — cùng hậu quả với việc WAL không
# được dọn: ổ đầy thì Postgres dừng ghi và hệ thống chết.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"


services:
  # Volume của Docker sinh ra thuộc root, mà Postgres chạy dưới uid 70. Không có
  # bước này thì archive_command lặng lẽ hỏng: CSDL vẫn chạy, healthcheck vẫn
  # xanh, chỉ có WAL không được lưu — tức là mất khả năng phục hồi theo thời
  # điểm mà không ai biết cho tới lúc cần dùng. Kiểm bằng pg_stat_archiver.
  pg-init:
    image: postgres:16-alpine
    user: root
    volumes:
      - pgarchive:/archive
      - pgbackup:/backup
    entrypoint: ["sh","-c","mkdir -p /archive /backup && chown -R 70:70 /archive /backup"]
    restart: "no"

  postgres:
    logging: *logging
    depends_on:
      pg-init: { condition: service_completed_successfully }
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: csbh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-csbh_dev_pw}
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - pgarchive:/archive
      - pgbackup:/backup
    shm_size: 256mb
    deploy:
      resources:
        limits: { memory: 3g }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d csbh"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [ internal ]

  redis:
    logging: *logging
    deploy:
      resources:
        limits: { memory: 384m }
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--maxmemory","256mb","--maxmemory-policy","noeviction"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [ redisdata:/data ]
    networks: [ internal ]

  rabbitmq:
    logging: *logging
    deploy:
      resources:
        limits: { memory: 512m }
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","-q","ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: [ mqdata:/var/lib/rabbitmq ]
    networks: [ internal ]

  minio:
    logging: *logging
    deploy:
      resources:
        limits: { memory: 512m }
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: csbh
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-csbh_dev_pw}
    healthcheck:
      test: ["CMD","mc","ready","local"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: [ miniodata:/data ]
    networks: [ internal ]

  # Chromium + LibreOffice trong một container, gọi qua HTTP. Xem lý do chọn
  # cách này thay vì nhúng Playwright vào ảnh của document ở infra/gotenberg.ts.
  gotenberg:
    logging: *logging
    deploy:
      resources:
        limits: { memory: 1g }
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    command:
      - gotenberg
      - --api-timeout=60s
      - --chromium-disable-javascript=true
    healthcheck:
      test: ["CMD","curl","-fsS","http://localhost:3000/health"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks: [ internal ]

  mailpit:
    logging: *logging
    deploy:
      resources:
        limits: { memory: 128m }
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    # Lưu thư xuống volume thay vì giữ trong bộ nhớ.
    #
    # `make demo-mail` phải TẠO LẠI container này để publish cổng 8025, và với
    # kho trong bộ nhớ thì đúng thao tác "mở hộp thư ra xem" lại xoá sạch thư
    # cần xem — kể cả liên kết kích hoạt vừa gửi.
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpitdata:/data
    healthcheck:
      test: ["CMD","/mailpit","readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ internal ]

  # Chạy một lần rồi thoát. Mọi service khác chờ nó xong.
  migrate:
    logging: *logging
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${PG_PASSWORD:-csbh_dev_pw}
      PGDATABASE: csbh
      # Đồng bộ mật khẩu chín DB role về đúng giá trị mà môi trường test dùng.
      # Chồng demo ghi đè biến này bằng file bí mật của nó; hai chồng dùng CHUNG
      # một Postgres nên lượt `make` nào chạy sau sẽ đặt lại cho đúng chính nó.
      ROLE_PASSWORD: ${ROLE_PASSWORD:-csbh_dev_pw}
      BACKUP_MIRROR_DIR: /mirror
    volumes:
      - ../db/migrations:/migrations:ro
      - ../scripts/migrate.sh:/migrate.sh:ro
      - ../scripts/reset-db.sh:/reset-db.sh:ro
      - ../scripts/backup.sh:/backup.sh:ro
      - ../scripts/restore.sh:/restore.sh:ro
      - ../scripts/basebackup.sh:/basebackup.sh:ro
      - pgarchive:/archive
      - ../../workspace/backup-mirror:/mirror
      - pgbackup:/backup
    entrypoint: ["/bin/sh","/migrate.sh"]
    restart: "no"
    networks: [ internal ]

networks:
  internal: {}

volumes:
  mailpitdata: {}
  pgdata: {}
  pgarchive: {}
  pgbackup: {}
  redisdata: {}
  mqdata: {}
  miniodata: {}
