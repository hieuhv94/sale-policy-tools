name: csbh

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: csbh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD:-csbh_dev_pw}
    volumes: [ pgdata:/var/lib/postgresql/data ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d csbh"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [ internal ]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--maxmemory","256mb","--maxmemory-policy","noeviction"]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes: [ redisdata:/data ]
    networks: [ internal ]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","-q","ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: [ mqdata:/var/lib/rabbitmq ]
    networks: [ internal ]

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: csbh
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-csbh_dev_pw}
    healthcheck:
      test: ["CMD","mc","ready","local"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes: [ miniodata:/data ]
    networks: [ internal ]

  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    healthcheck:
      test: ["CMD","/mailpit","readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [ internal ]

  # Chạy một lần rồi thoát. Mọi service khác chờ nó xong.
  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGPASSWORD: ${PG_PASSWORD:-csbh_dev_pw}
      PGDATABASE: csbh
    volumes:
      - ../db/migrations:/migrations:ro
      - ../scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/sh","/migrate.sh"]
    restart: "no"
    networks: [ internal ]

networks:
  internal: {}

volumes: { pgdata: {}, redisdata: {}, mqdata: {}, miniodata: {} }
