# Trình chạy test. Mã nguồn bind-mount vào, thư mục workspace để ghi log và báo cáo.
services:
  test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      mailpit:  { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio:    { condition: service_healthy }
      gotenberg: { condition: service_healthy }
      migrate:  { condition: service_completed_successfully }
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: csbh
      PG_SUPERUSER: postgres
      PG_PASSWORD: ${PG_PASSWORD:-csbh_dev_pw}
      ROLE_PASSWORD: csbh_dev_pw
      REDIS_URL: redis://redis:6379
      MAILPIT_URL: http://mailpit:8025
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      RABBITMQ_URL: amqp://rabbitmq:5672
      # Test tự gọi pumpOnce() ở đúng chỗ cần. Bơm nền theo đồng hồ làm mỗi
      # khẳng định phụ thuộc vào việc bộ đếm 1 giây có kịp nổ hay chưa.
      OUTBOX_AUTO_PUMP: "0"
      SLA_AUTO_SCAN: "0"
      MAIL_RETRY_BACKOFF_MS: "5,5,5"
      MINIO_HOST: minio
      MINIO_PORT: "9000"
      MINIO_ACCESS_KEY: csbh
      MINIO_PASSWORD: ${MINIO_PASSWORD:-csbh_dev_pw}
      MINIO_BUCKET: csbh-test
      GOTENBERG_URL: http://gotenberg:3000
      APP_VERSION: ${APP_VERSION:-0.0.0-dev}
    volumes:
      - ..:/app
      - ../../workspace:/workspace
      - ../scripts/backup.sh:/backup.sh:ro
      - ../scripts/restore.sh:/restore.sh:ro
      - pgbackup:/backup
      - pnpm_store:/pnpm-store
      # Mỗi package pnpm sinh ra một node_modules riêng. Không che bằng volume
      # thì chúng bị ghi thẳng ra máy thật qua bind-mount ở trên, do root sở hữu,
      # và người dùng có phụ thuộc Node nằm trong workspace dù đã yêu cầu mọi thứ
      # chỉ chạy trong Docker. Thêm một dòng cho mỗi package mới.
      - node_modules:/app/node_modules
      - nm_identity:/app/services/identity/node_modules
      - nm_domain_policy:/app/packages/domain-policy/node_modules
      - nm_identity_core:/app/packages/identity-core/node_modules
      - nm_contracts:/app/packages/contracts/node_modules
      - nm_http_kit:/app/packages/http-kit/node_modules
      - nm_catalog:/app/services/catalog/node_modules
      - nm_customer:/app/services/customer/node_modules
      - nm_policy:/app/services/policy/node_modules
      - nm_bus:/app/packages/bus/node_modules
      - nm_notification:/app/services/notification/node_modules
      - nm_document:/app/services/document/node_modules
      - nm_sla:/app/services/sla-worker/node_modules
      - nm_audit:/app/services/audit/node_modules
      - nm_reporting:/app/services/reporting/node_modules
    working_dir: /app
    networks: [ internal ]

volumes:
  pgbackup:
    external: true
    name: csbh_pgbackup
  pnpm_store: {}
  node_modules: {}
  nm_identity: {}
  nm_domain_policy: {}
  nm_identity_core: {}
  nm_contracts: {}
  nm_http_kit: {}
  nm_catalog: {}
  nm_customer: {}
  nm_policy: {}
  nm_bus: {}
  nm_notification: {}
  nm_document: {}
  nm_sla: {}
  nm_audit: {}
  nm_reporting: {}
